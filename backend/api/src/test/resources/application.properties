# Configurações para testes - sobrescreve o application.properties principal
# Desabilita a tentativa de conectar ao banco real durante os testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

management.endpoints.web.base-path=/sistema-interno-dados
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

spring.security.user.name=admin_monitoramento
spring.security.user.password=temp_pass

jwt.secret=test-secret-for-local-validation-123456789012345678901234567890

springdoc.swagger-ui.path=/test-swagger-ui.html

