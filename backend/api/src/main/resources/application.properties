spring.application.name=api
server.port=${PORT:8080}

# Carrega as variáveis do Supabase a partir do arquivo .env na raiz do projeto
spring.config.import=optional:file:../.env[.properties],optional:file:../../.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_URL}:${DB_PORT:5432}/postgres?user=${DB_USERNAME}&password=${DB_PASSWORD}&sslmode=${DB_SSL_MODE:require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

management.endpoints.web.base-path=/sistema-interno-dados
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

spring.security.user.name=${MONITORING_USER:admin_monitoramento}
spring.security.user.password=${MONITORING_PASSWORD:temp_pass}

springdoc.swagger-ui.path=/test-swagger-ui.html