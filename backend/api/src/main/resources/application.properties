spring.application.name=api
server.port=${PORT:8080}

spring.config.import=optional:file:../../.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_URL}:5432/postgres
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.base-path=/sistema-interno-dados
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

spring.security.user.name=${MONITORING_USER:admin_monitoramento}
spring.security.user.password=${MONITORING_PASSWORD:temp_pass}