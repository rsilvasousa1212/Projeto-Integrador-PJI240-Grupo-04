name: Deploy Backend to Google Cloud Run

on:
  push:
    branches:
      - dev_fabio  # Dispara em qualquer push na branch dev_fabio

env:
  PROJECT_ID: epatrimonio-509312
  SERVICE_NAME: epatrimonio-backend
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build e Push da Imagem usando Cloud Build
        run: |
          gcloud builds submit \
            --project="${{ env.PROJECT_ID }}" \
            --tag="gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}" \
            ./backend/api

      - name: Implantar no Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --project="${{ env.PROJECT_ID }}" \
            --image="gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}" \
            --platform=managed \
            --region="${{ env.REGION }}" \
            --allow-unauthenticated \
            --port=8080 \
            --memory=1Gi \
            --set-env-vars="CORS_ALLOWED_ORIGINS=https://epatrimonio-backend-982353293618.us-central1.run.app" \
            --set-secrets="DB_URL=DB_URL:latest,DB_USERNAME=DB_USERNAME:latest,DB_PASSWORD=DB_PASSWORD:latest,DB_PORT=DB_PORT:latest,DB_SSL_MODE=DB_SSL_MODE:latest,MONITORING_USER=MONITORING_USER:latest,MONITORING_PASSWORD=MONITORING_PASSWORD:latest"
