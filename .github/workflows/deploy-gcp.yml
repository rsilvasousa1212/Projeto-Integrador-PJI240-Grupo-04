name: Deploy Backend to Google Cloud Run

on:
  push:
    branches:
      - dev_fabio  # Dispara em qualquer push na branch dev_fabio

env:
  PROJECT_ID: epatrimonio-509312
  SERVICE_NAME: epatrimonio-backend
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build e Push da Imagem usando Cloud Build
        run: |
          gcloud builds submit \
            --project="${{ env.PROJECT_ID }}" \
            --tag="gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}" \
            ./backend/api

      # Mudança: Adicionamos a flag --async no final para não travar na leitura do log
      - name: Build e Push da Imagem usando Cloud Build
        run: |
          gcloud builds submit \
            --tag gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            ./backend \
            --async

      # Adicionamos uma pequena pausa de 15 segundos para dar tempo do container começar a existir antes do deploy
      - name: Aguardar processamento inicial
        run: sleep 15

        
      - name: Implantar no Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --project="${{ env.PROJECT_ID }}" \
            --image="gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}" \
            --platform=managed \
            --region="${{ env.REGION }}" \
            --allow-unauthenticated \
            --port=8080